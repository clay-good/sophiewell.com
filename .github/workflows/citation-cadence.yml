name: citation-cadence

# spec-v85 §6.3 / spec-v90 §4: warn-only monthly citation-cadence job. It reads
# our own docs/citation-staleness.md ledger and annotates the run when a
# calendar-tracked Class-B row is overdue for a re-verification. It never blocks
# (the script always exits 0) and never auto-edits -- a guideline update is
# always a reviewed, audited maintainer change (spec-v85 §6.4).

on:
  schedule:
    # Monthly, 1st of the month, 07:00 UTC.
    - cron: '0 7 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  # spec-v1004: so a dead-link finding can be filed as an issue rather than
  # printed into a log nobody opens.
  issues: write

jobs:
  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Check citation cadence (warn-only)
        run: node scripts/check-citation-cadence.mjs

      # spec-v979: the first step of the monthly pass in docs/pa-maintenance.md is
      # "open each sources[].url and confirm it still resolves". Nothing did the
      # resolving, and 18 of the ledger's 84 authorities had gone to a 404. This
      # does the half a machine can do. Warn-only and NETWORK, which is why it lives
      # here and not in `npm run lint` -- lint stays offline and deterministic.
      # spec-v1002 found twelve dead authorities in one run of the step below.
      # They had been dead for months while this job faithfully reported them --
      # into a log nobody opens. Warn-only is still right (a publisher outage
      # must not fail CI), but the report has to reach a person, so the results
      # are captured and, if anything is DEAD, filed as an issue.
      #
      # Issue #19: the filing step used to grep the printed report for a DEAD
      # header, which the checker prints for ACKNOWLEDGED dead rows too -- so the
      # documented remedy (an acknowledgments[] entry) could never stop the issue
      # from being re-filed. Each checker now runs with --strict and the step
      # records its exit status: 0 is clean, 1 is an unacknowledged dead link,
      # anything else is the check itself crashing, which is filed too because a
      # check that dies quietly reports "clean" forever.
      - name: Check PA source URLs still resolve (warn-only)
        run: |
          status=0
          node scripts/check-pa-source-urls.mjs --strict > /tmp/pa-urls.txt 2>&1 || status=$?
          cat /tmp/pa-urls.txt
          echo "$status" > /tmp/pa-urls.status

      # spec-v1004: the same question for the documents a contributor reads.
      # docs/legal.md had cited NADAC at a path that moved.
      - name: Check living-doc links still resolve (warn-only)
        run: |
          status=0
          node scripts/check-doc-links.mjs --strict > /tmp/doc-links.txt 2>&1 || status=$?
          cat /tmp/doc-links.txt
          echo "$status" > /tmp/doc-links.status

      - name: File an issue if any source link is dead, close it once clean
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          dead=0
          for f in /tmp/pa-urls.status /tmp/doc-links.status; do
            # A missing status file means its step never ran to the end.
            s=$(cat "$f" 2>/dev/null || echo missing)
            [ "$s" = "0" ] || dead=1
          done
          {
            echo "## Monthly source-link check"
            echo
            echo '```'
            cat /tmp/pa-urls.txt /tmp/doc-links.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          title="chore: dead source links found by the monthly check"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ "$dead" = "0" ]; then
            echo "no unacknowledged dead links"
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "The monthly link check is clean again: no unacknowledged dead links. Run: $RUN_URL"
            fi
            exit 0
          fi
          body=$(printf '%s\n\n```\n%s\n```\n' \
            "The monthly link check found at least one dead source link (or the check failed to finish). A rule or citation that points at a dead page reads as authoritative while being wrong. Run: $RUN_URL" \
            "$(cat /tmp/pa-urls.txt /tmp/doc-links.txt 2>/dev/null)")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
