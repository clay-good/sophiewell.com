name: citation-cadence

# spec-v85 §6.3 / spec-v90 §4: warn-only monthly citation-cadence job. It reads
# our own docs/citation-staleness.md ledger and annotates the run when a
# calendar-tracked Class-B row is overdue for a re-verification. It never blocks
# (the script always exits 0) and never auto-edits -- a guideline update is
# always a reviewed, audited maintainer change (spec-v85 §6.4).

on:
  schedule:
    # Monthly, 1st of the month, 07:00 UTC.
    - cron: '0 7 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Check citation cadence (warn-only)
        run: node scripts/check-citation-cadence.mjs

      # spec-v979: the first step of the monthly pass in docs/pa-maintenance.md is
      # "open each sources[].url and confirm it still resolves". Nothing did the
      # resolving, and 18 of the ledger's 84 authorities had gone to a 404. This
      # does the half a machine can do. Warn-only and NETWORK, which is why it lives
      # here and not in `npm run lint` -- lint stays offline and deterministic.
      - name: Check PA source URLs still resolve (warn-only)
        run: node scripts/check-pa-source-urls.mjs
