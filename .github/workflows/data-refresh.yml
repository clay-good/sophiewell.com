name: data-refresh

on:
  schedule:
    # Weekly, Sunday 06:00 UTC.
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # spec-v1721: the two facts the jobs below need, and the reason they are outputs rather than
    # "did this job pass". `packaged` says the patch and the reports exist, so there is something to
    # publish; `suite` says whether lint and the unit tests passed on those same bytes. They are
    # separate because a superseded FDA label makes the second false ON PURPOSE (see below), and the
    # week's work must still reach a person.
    outputs:
      packaged: ${{ steps.pack.outputs.packaged }}
      suite: ${{ steps.suite.outcome }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Snapshot previous data
        run: |
          mkdir -p /tmp/prev-data
          if [ -d data ]; then cp -R data /tmp/prev-data/; fi

      - name: Build curated datasets
        run: node scripts/build-data.mjs

      # spec-v1621: the live builders. Each fetches its publisher's newest
      # edition, checks it (bounds, the 20% rule, canaries), and writes only
      # when the source changed. A failed builder keeps the previous data and
      # is named in the summary; it never fails this job.
      - name: Fetch federal datasets
        run: node scripts/data/run.mjs --summary data-refresh-summary.json

      - name: Verify integrity
        run: node scripts/verify-integrity.mjs

      # spec-v987: rebuilt so THIS job's own lint and determinism checks pass on
      # the branch -- and deliberately kept out of the pull request below.
      #
      # The comment here used to say the corpus is derived from data/ and that a
      # refresh can change its bytes. It is not, and it cannot:
      # build-search-corpus.mjs reads app.js, lib/meta.js, mcp/catalog.js and
      # data/tool-copy/, all of them catalog, none of them fetched weekly.
      # Editing a dataset and rebuilding leaves corpus.json byte-identical.
      #
      # What the rebuild actually picks up is CATALOG drift that landed on main
      # since the corpus was last committed -- and shipping that inside a DATA
      # pull request is what makes the PR go stale. #13 sat open across a day of
      # catalog work and could no longer merge: its dataset content was
      # unchanged, and its two corpus byte counts were four days old.
      - name: Rebuild search corpus
        run: node scripts/build-search-corpus.mjs

      - name: Generate data change summary
        run: |
          node scripts/data/summarize.mjs data-refresh-summary.json > data-refresh-summary.md
          echo >> data-refresh-summary.md
          echo "Automated weekly refresh of bundled public datasets." >> data-refresh-summary.md
          echo "See scripts/sources.md for the canonical source URL of each dataset." >> data-refresh-summary.md
          echo >> data-refresh-summary.md
          node scripts/analyze-data-changes.mjs --previous /tmp/prev-data/data --current data >> data-refresh-summary.md
          # spec-v1517 route B: the cited CFR sections amended since their tools last read them. It never fails.
          echo >> data-refresh-summary.md
          node scripts/data/watch-ecfr.mjs >> data-refresh-summary.md || true
          echo >> data-refresh-summary.md
          node scripts/data/watch-pages.mjs >> data-refresh-summary.md || true
          echo >> data-refresh-summary.md
          node scripts/data/watch-upstream.mjs >> data-refresh-summary.md || true
          # spec-v1628 section 1, route D: the FDA labels the tools read. A new version whose watched
          # sections did not change is renewed in scripts/data/label-editions.json; a changed section
          # marks the row superseded and is listed here for a person to re-read. It never fails.
          echo >> data-refresh-summary.md
          node scripts/data/watch-dailymed.mjs --write >> data-refresh-summary.md || true
          # Fail closed: the tools read that state from lib/label-editions.js, so a superseded label
          # stops answering in the browser with this pull request. The SBOM hashes lib/, so it is
          # rebuilt with it. Both are no-ops in a week when no label row changed.
          node scripts/build-label-editions.mjs
          node scripts/build-sbom.mjs

      # spec-v1622 step 5: the one list of every dataset and dated constant,
      # which the freshness job below publishes as an issue.
      - name: Freshness report
        run: node scripts/report-freshness.mjs > freshness.md

      # ':!data/search-corpus' -- see the rebuild step. The corpus belongs to
      # whoever changed the catalog; a data refresh must not carry it.
      - name: Package reviewed changes
        id: pack
        # A new edition can add shard files; `git add -N` makes git diff show
        # them, since it lists only tracked paths.
        run: |
          git add --intent-to-add -- data scripts/expected-hashes.json scripts/data/label-editions.json
          git diff --binary -- data scripts/expected-hashes.json scripts/data/label-editions.json lib/label-editions.js sbom.json sbom.md ':!data/search-corpus' > data-refresh.patch
          echo "packaged=true" >> "$GITHUB_OUTPUT"

      - name: Upload reviewed changes
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: data-refresh
          path: |
            data-refresh.patch
            data-refresh-summary.md
            data-refresh-summary.json
            freshness.md
          retention-days: 1

      # spec-v1721: this runs AFTER the patch is packaged and uploaded, and it does not abort the job.
      #
      # It used to run before them, and that quietly cost a whole week of refreshing. The label watch
      # above marks a row superseded the moment DailyMed changes a section a tool reads, and
      # build-label-editions.mjs writes that state into lib/, by the fail-closed rule of spec-v1628
      # route D. The tiles that read the row then answer with a withholding notice and no figure --
      # which is correct, and which `check-mcp-catalog` (the example round-trip) and the unit tests
      # that assert those labels answer both read as failures. They are right to: a person must
      # re-read the label. But the job died here, so `Package reviewed changes` never ran, the
      # artifact was never uploaded, and the two jobs below were skipped. No pull request, no
      # freshness issue, and every other dataset's update for that week thrown away. The 2026-11-08
      # run failed exactly this way on one superseded label, and the `data-review` branch the publish
      # job below writes for this very case was unreachable.
      #
      # So the suite still runs on the refreshed bytes and its result still decides whether anything
      # may merge -- the publish job forces review when it is not green -- but it no longer decides
      # whether the week's work reaches a person.
      - name: Run full test suite on refreshed data
        id: suite
        continue-on-error: true
        run: |
          npm run lint
          npm run test:unit
          npm run test:a11y

  # spec-v1721: the red X the refresh job gives up by packaging first, as a job of its own rather
  # than a failing step at the end of `refresh`.
  #
  # The difference matters. If `refresh` itself failed, everything below would hang on whether GitHub
  # hands a FAILED job's outputs to its dependents -- and if it does not, `packaged` reads empty,
  # publish and freshness skip, and the week's work is lost exactly as it is today, silently. Leaving
  # `refresh` to conclude successfully puts that question beyond doubt. The run still goes red here.
  suite-result:
    needs: refresh
    # Wrapped in ${{ }} because a bare leading `!` is a YAML tag indicator, not a negation.
    if: ${{ !cancelled() && needs.refresh.outputs.suite != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: The suite did not pass on the refreshed data
        run: |
          echo "::error::lint, test:unit or test:a11y failed on the refreshed data (see the refresh job's log). The pull request is open for review and must not be merged until this is green."
          exit 1

  publish:
    needs: refresh
    # spec-v1721: gated on the artifact existing, not on the refresh job passing. A superseded FDA
    # label reddens the suite by design, and that is exactly the week a person most needs this pull
    # request: it carries the fail-closed state and the list of labels to re-read.
    if: ${{ !cancelled() && needs.refresh.outputs.packaged == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: data-refresh
          path: .data-refresh
      - name: Apply reviewed changes
        run: git apply .data-refresh/data-refresh.patch

      # spec-v1721: say it at the top of the pull request, and of the freshness issue, which is
      # rewritten from this same file. A reader must not have to open the run log to learn that the
      # gates did not pass on the bytes in front of them.
      - name: Say so when the suite did not pass
        if: needs.refresh.outputs.suite != 'success'
        run: |
          {
            echo "> **The refresh job's lint, unit and accessibility checks did not pass on these bytes.**"
            echo "> Do not merge until they are green. A label row marked superseded below is the usual"
            echo "> reason: the tools that read it withhold their figures until a person re-reads the"
            echo "> label and records it, and the checks that assert those figures fail meanwhile."
            echo
            cat .data-refresh/data-refresh-summary.md
          } > /tmp/body.md
          mv /tmp/body.md .data-refresh/data-refresh-summary.md
      - name: Open pull request if data changed
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ github.token }}
          branch: data/weekly-refresh
          title: 'data: weekly refresh'
          commit-message: 'data: weekly refresh of bundled datasets'
          body-path: .data-refresh/data-refresh-summary.md
          add-paths: |
            data/**
            :!data/search-corpus/**
            scripts/expected-hashes.json
            scripts/data/label-editions.json
            lib/label-editions.js
            sbom.json
            sbom.md

      # spec-v1621 §5: merge the pull request only when the run's own
      # decision says every dataset is unchanged or updated cleanly -- canaries
      # passing, counts inside bounds and within 20%, no same-edition re-post,
      # no builder failure. The lint and unit tests already ran on these bytes
      # in the refresh job. Anything else waits for a person, labeled.
      - name: Merge, or ask for review
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          decision=$(node scripts/data/summarize.mjs .data-refresh/data-refresh-summary.json --decision)
          # spec-v1628 section 1: a label section a tool reads changed, or its set id was retired.
          # The row is marked superseded in this pull request; a person re-reads the label before it merges.
          if grep -q -E '^- .*(Re-read these rows in|Re-read the label for)' .data-refresh/data-refresh-summary.md; then decision=review; fi
          # spec-v1721: the refresh job's own comment below this one used to be able to say "the lint
          # and unit tests already ran on these bytes" and stop there, because a red suite killed the
          # run. The suite no longer does that, so the merge decision has to read its result itself.
          if [ "${{ needs.refresh.outputs.suite }}" != "success" ]; then decision=review; fi
          if [ "$decision" = "merge" ]; then
            gh pr merge "$PR" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
          else
            gh label create data-review --color D93F0B --description "Weekly data refresh needs a person" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh pr edit "$PR" --add-label data-review --repo "$GITHUB_REPOSITORY"
          fi

  # spec-v1621 §5: one issue titled "Data freshness", rewritten every run, so
  # anyone can see every dataset's coverage, edition, status and expiry
  # without reading the repository. Pinning it is one click for the maintainer.
  freshness:
    needs: refresh
    # spec-v1721: as above. A week whose suite went red is a week the freshness issue must still be
    # rewritten -- the 2026-11-08 failure left it stating the state of 2026-11-01 for a fortnight.
    if: ${{ !cancelled() && needs.refresh.outputs.packaged == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: data-refresh
          path: .data-refresh
      - name: Rewrite the Data freshness issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Rewritten by the weekly data-refresh workflow on $(date -u +%Y-%m-%d). Do not edit by hand."
            echo
            echo "## Last run"
            echo
            cat .data-refresh/data-refresh-summary.md
            echo
            echo "## Every dataset and dated value"
            echo
            cat .data-refresh/freshness.md
            echo
            echo "NCCI procedure-to-procedure edits and OPPS Addendum B are not fetched: they sit behind the AMA click-through (spec-v1621 section 3.4). Tools ask for the reader's own copy."
          } > body.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Data freshness"' --json number,title --jq '.[] | select(.title == "Data freshness") | .number' | head -1)
          if [ -n "$n" ]; then gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "Data freshness" --body-file body.md; fi
