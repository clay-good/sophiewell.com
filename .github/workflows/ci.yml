name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # spec-v1719: the full Firefox and WebKit run moved off every push and onto this
  # schedule (see the `e2e-cross-browser` job). 07:00 UTC, after the US day's pushes.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# spec-v983: without a concurrency group, a contributor pushing a fixup to their
# own pull request left the superseded run grinding through the browser matrix,
# and four pushes queued hours of runner time to verify code that no longer
# existed. Superseded PR runs are cancelled.
#
# spec-v1719: and now superseded `main` runs are too. They used to be grouped by
# commit and never cancelled, so that every commit on main was verified on its
# own. That rule cost more than it bought once the e2e job fanned out to a dozen
# runners per push: on November 14, 2026 five main runs were in flight at once,
# and a new push's shards sat queued for half an hour behind runs whose code a
# newer, already-green run had verified.
#
# What it gives up: when several commits land on main in quick succession, only
# the newest is verified, so a failure points at a range of commits rather than
# one. Deploying is a manual step (docs/release.md) and is made from a commit whose
# run is green, so no unverified commit ships. Grouping by branch keeps one run
# per branch; GitHub's one-pending-run-per-group rule is the point now, not a
# hazard. The event name is in the group so that a morning push never cancels the
# nightly run, which is the only full Firefox and WebKit run there is.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build seed data
        run: SOPHIEWELL_OFFLINE=1 node scripts/build-data.mjs
      - name: Seed data is byte-stable
        # spec-v1622: a run over unchanged seeds writes nothing. The manifests
        # used to carry a `fetchDate` restamped on every run, so this could not
        # be checked; now a diff here means a builder is not deterministic.
        run: git diff --exit-code -- data ':!data/search-corpus'
      - name: Verify data integrity
        run: node scripts/verify-integrity.mjs
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Static accessibility check
        run: npm run test:a11y
      - name: Static build
        run: npm run build
      - name: The build must be idempotent
        # spec-v990/v991: `npm run build` writes back into the repo, not only
        # into dist/. It regenerated the five icons with bytes that depended on
        # whether `sharp` happened to be in the dependency tree, and it stamped a
        # fresh clock into the SBOM on every run. Both are fixed; this fails if
        # a build ever moves one of the paths it writes again.
        #
        # One deliberate exclusion (the dataset manifests are checked by the
        # `Seed data is byte-stable` step): data/search-corpus/manifest.json
        # (spec-v993). Its `gzipBytes` is a
        # measurement taken with the local zlib, so it differs between a
        # contributor's machine and this runner even when the corpus is
        # byte-identical -- the `hash` beside it is what actually pins the
        # content, and corpus.json and corpus-detail.json are checked in full.
        run: >-
          git diff --exit-code --
          index.html sitemap.xml report-catalog.js sbom.json sbom.md
          data/search-corpus/corpus.json data/search-corpus/corpus-detail.json
          data/fields
          favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png logo.png

  # spec-v183: the optional stdio MCP surface. Independent of the site jobs.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mcp
      - name: MCP catalog gate
        run: node scripts/check-mcp-catalog.mjs
      - name: MCP tool tests
        run: npm run test:mcp

  # spec-v1719: the e2e job had grown to 2.7 hours on one runner -- every spec in
  # three browsers, behind the 12-minute unit job. It is now:
  #
  #   e2e                 Chromium, the whole suite, split across eight runners in
  #                       parallel and no longer waiting on `unit`. Every catalog
  #                       sweep was already Chromium-only, so this is all of the
  #                       safety signal. Four shards ran 9 to 47 minutes on the
  #                       first run (the heavy sweeps cluster), so it is eight.
  #   e2e-cross-browser   Firefox and WebKit. On a push, the smoke spec only -- an
  #                       engine that cannot boot the app fails here in minutes. The
  #                       full suite in both engines runs nightly and on demand.
  #
  # What that gives up, said plainly: a Firefox- or WebKit-only regression in a
  # spec other than smoke is caught the next morning, not on the push. Those two
  # engines also produced every one of the seven flakes on the spec-v1717 run.
  #
  # Pinned, not `ubuntu-latest`: on 2026-10-27 the hosted image rolled to Ubuntu
  # 26.04 and `playwright install` refused it outright ("Playwright does not
  # support chromium on ubuntu26.04-x64"), failing every push on an image change
  # rather than on a code change. The browsers are the one thing in this workflow
  # that cares which distro it is, so these jobs name the image they were tested
  # on; bumping @playwright/test to a release that supports 26.04 is what lets
  # them go back to `ubuntu-latest`. The comment sits above the job key on
  # purpose: the release:check coverage test finds a job's end by `  <name>:` +
  # `runs-on`, so `runs-on` stays the first line of every job.
  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build seed data
        run: SOPHIEWELL_OFFLINE=1 node scripts/build-data.mjs
      - name: Seed data is byte-stable
        # spec-v1622: a run over unchanged seeds writes nothing. The manifests
        # used to carry a `fetchDate` restamped on every run, so this could not
        # be checked; now a diff here means a builder is not deterministic.
        run: git diff --exit-code -- data ':!data/search-corpus'
      - name: Static build
        run: npm run build
      - name: End-to-end tests (Chromium, shard ${{ matrix.shard }} of 8)
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/8
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # spec-v1719: see the note above `e2e`. A push runs the smoke spec in both
  # engines; the schedule and a manual run take the whole suite.
  e2e-cross-browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build seed data
        run: SOPHIEWELL_OFFLINE=1 node scripts/build-data.mjs
      - name: Static build
        run: npm run build
      - name: Smoke (${{ matrix.browser }})
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npx playwright test --project=${{ matrix.browser }} test/integration/smoke.spec.js
      - name: Full suite (${{ matrix.browser }})
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
