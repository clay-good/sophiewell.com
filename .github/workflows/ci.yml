name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# spec-v983: the e2e job takes about 57 minutes. Without a concurrency group, a
# contributor pushing a fixup to their own pull request leaves the superseded run
# grinding through the full browser matrix for another hour, and four pushes queue
# four hours of runner time to verify code that no longer exists.
#
# Superseded PR runs are cancelled. Runs on `main` are NOT: the deployed site
# tracks `main`, so every commit on it is a deploy candidate and has to be
# verified on its own. They queue behind each other instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build seed data
        run: SOPHIEWELL_OFFLINE=1 node scripts/build-data.mjs
      - name: Verify data integrity
        run: node scripts/verify-integrity.mjs
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Static accessibility check
        run: npm run test:a11y
      - name: Static build
        run: npm run build

  # spec-v183: the optional stdio MCP surface. Independent of the site jobs.
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mcp
      - name: MCP catalog gate
        run: node scripts/check-mcp-catalog.mjs
      - name: MCP tool tests
        run: npm run test:mcp

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build seed data
        run: SOPHIEWELL_OFFLINE=1 node scripts/build-data.mjs
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
